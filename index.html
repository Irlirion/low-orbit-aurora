<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Low Orbit Internet — Live Aurora Field</title>
<style>
/* ─────────────────────────────────────────────────────────────────────────
 * design-systems/spacex/tokens.css
 *
 * Structured token bindings for "Design System Inspired by SpaceX".
 * Cinematic aerospace minimalism: pure black canvas, full-viewport
 * photography, D-DIN industrial type, universal uppercase + positive
 * tracking, zero shadows / cards / decoration. The interface disappears
 * behind the imagery — only type, photography, and a single ghost button.
 * ─────────────────────────────────────────────────────────────────── */

:root {
  /* ─── Surface ───────────────────────────────────────────────────── */
  --bg: #000000;             /* Space Black — pure void, the foundation canvas */
  --surface: #000000;        /* No card surfaces — content sits directly on the void */
  --surface-warm: var(--surface); /* alias — no warm tier in an achromatic system */

  /* ─── Foreground ────────────────────────────────────────────────── */
  --fg: #f0f0fa;             /* Spectral White — primary text, mission-critical signal */
  --fg-2: var(--fg);         /* alias — single text weight throughout the system */
  --muted: rgba(240, 240, 250, 0.7); /* Dimmed spectral — captions, secondary labels */
  --meta: var(--muted);      /* alias — tertiary FG identical to muted on dark canvas */

  /* ─── Border ────────────────────────────────────────────────────── */
  --border: rgba(240, 240, 250, 0.35); /* Ghost Border — DESIGN.md §2 verbatim */
  --border-soft: rgba(240, 240, 250, 0.1); /* Inner separators / barely-visible dividers */

  /* ─── Accent ────────────────────────────────────────────────────── */
  --accent: #f0f0fa;         /* Spectral White stands in for any brand accent */
  --accent-on: #000000;      /* Black text when accent is the bg */
  --accent-hover: #ffffff;   /* Hover White — pure white per DESIGN.md §2 */
  --accent-active: #d8d8e6;  /* Dimmed spectral — pressed state */

  /* ─── Semantic ──────────────────────────────────────────────────── */
  --success: #16a34a;
  --warn: #eab308;
  --danger: #dc2626;

  /* ─── Typography ────────────────────────────────────────────────── */
  --font-display: "D-DIN-Bold", "D-DIN", "DIN Alternate", "Helvetica Neue", Arial, Verdana, sans-serif;
  --font-body: "D-DIN", "DIN Alternate", "Helvetica Neue", Arial, Verdana, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Monaco, Consolas, monospace;

  --text-xs: 10px;           /* Micro — uppercase ghost labels */
  --text-sm: 12px;           /* Caption / Nav Link — uppercase */
  --text-base: 16px;         /* Body — standard reading text */
  --text-lg: 20px;
  --text-xl: 24px;
  --text-2xl: 32px;
  --text-3xl: 40px;
  --text-4xl: 48px;          /* Display Hero — D-DIN-Bold uppercase */

  --leading-body: 1.5;       /* DESIGN.md says 1.5–1.7 for reading body */
  --leading-tight: 1.0;      /* Display / mission-briefing rhythm */
  --tracking-display: 0.02em; /* = 0.96px at 48px — DESIGN.md §3 hero spec verbatim */

  /* ─── Spacing ───────────────────────────────────────────────────── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;

  /* ─── Section rhythm ────────────────────────────────────────────── */
  --section-y-desktop: 120px;
  --section-y-tablet: 80px;
  --section-y-phone: 56px;

  /* ─── Radius ────────────────────────────────────────────────────── */
  --radius-sm: 4px;
  --radius-md: 4px;          /* No medium tier exists — same as sm */
  --radius-lg: 4px;          /* No large tier exists — same as sm */
  --radius-pill: 32px;       /* Ghost button radius — the only rounded element */

  /* ─── Elevation (ZERO shadows) ──────────────────────────────────── */
  --elev-flat: none;
  --elev-ring: 0 0 0 1px var(--border); /* Hairline spectral ring — ghost-button edge */
  --elev-raised: none;       /* Zero shadows — photography carries depth */

  /* ─── Focus ring ────────────────────────────────────────────────── */
  --focus-ring: 0 0 0 2px var(--accent);

  /* ─── Motion ────────────────────────────────────────────────────── */
  --motion-fast: 150ms;
  --motion-base: 200ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);

  /* ─── Layout ────────────────────────────────────────────────────── */
  --container-max: 1440px;
  --container-gutter-desktop: 24px;
  --container-gutter-tablet: 20px;
  --container-gutter-phone: 18px;
}

/* ─── Page shell ────────────────────────────────────────────────────── */
* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color-scheme: dark;
  font-family: var(--font-body);
}
/* Static spectral haze — visible only if WebGL2 is unavailable. */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(120% 70% at 20% 8%, rgba(240, 240, 250, 0.10), rgba(0, 0, 0, 0) 55%),
    radial-gradient(90% 60% at 78% 26%, rgba(150, 160, 250, 0.10), rgba(0, 0, 0, 0) 60%),
    radial-gradient(140% 80% at 50% 118%, rgba(240, 240, 250, 0.16), rgba(0, 0, 0, 0) 46%);
  pointer-events: none;
}

#gl {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  z-index: 1;
}

/* ─── HUD — telemetry readout, top right ───────────────────────────── */
.hud {
  position: fixed;
  top: clamp(14px, 3vw, 28px);
  right: clamp(14px, 3vw, 28px);
  z-index: 3;
  display: flex;
  align-items: center;
  gap: var(--space-2);
}
.hud-status {
  font-family: var(--font-body);
  font-size: var(--text-xs);
  line-height: 0.94;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
  background: rgba(0, 0, 0, 0.6);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm);
  padding: 10px var(--space-3);
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  white-space: nowrap;
}
.hud-toggle {
  font-family: var(--font-body);
  font-size: var(--text-xs);
  font-weight: 700;
  line-height: 0.94;
  letter-spacing: 1.17px;
  text-transform: uppercase;
  color: var(--fg);
  background: rgba(240, 240, 250, 0.1);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 0 var(--space-4);
  min-height: 44px;
  min-width: 44px;
  cursor: pointer;
  transition:
    background-color var(--motion-fast) var(--ease-standard),
    color var(--motion-fast) var(--ease-standard),
    border-color var(--motion-fast) var(--ease-standard);
}
.hud-toggle:hover {
  background: rgba(240, 240, 250, 0.2);
  color: var(--accent-hover);
}
.hud-toggle:active {
  background: rgba(240, 240, 250, 0.06);
  color: var(--accent-active);
}
.hud-toggle:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}

/* ─── Hero overlay — type on scene, no containers ──────────────────── */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: flex-end;
  padding: clamp(24px, 6vw, 88px);
  padding-bottom: clamp(36px, 8vh, 96px);
  pointer-events: none;
  color: var(--fg);
  background:
    linear-gradient(to top, rgba(0, 0, 0, 0.75) 0%, rgba(0, 0, 0, 0.5) 32%, rgba(0, 0, 0, 0) 60%),
    linear-gradient(to right, rgba(0, 0, 0, 0.5) 0%, rgba(0, 0, 0, 0) 55%);
}
.kicker {
  margin: 0 0 var(--space-5);
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 700;
  line-height: 0.94;
  letter-spacing: 1.17px;
  text-transform: uppercase;
  color: var(--fg);
}
.hero-title {
  margin: 0;
  font-family: var(--font-display);
  font-size: clamp(32px, 4.6vw, var(--text-4xl));
  font-weight: 700;
  line-height: var(--leading-tight);
  letter-spacing: var(--tracking-display);
  text-transform: uppercase;
  max-width: 14ch;
  color: var(--fg);
}
.hero-sub {
  margin: var(--space-5) 0 0;
  font-family: var(--font-body);
  font-size: var(--text-base);
  font-weight: 400;
  line-height: 1.6;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  max-width: 46ch;
  color: var(--muted);
}

/* ─── Ghost button — the single primary CTA ────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 700;
  line-height: 0.94;
  letter-spacing: 1.17px;
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
  transition:
    background-color var(--motion-fast) var(--ease-standard),
    color var(--motion-fast) var(--ease-standard),
    border-color var(--motion-fast) var(--ease-standard),
    transform var(--motion-fast) var(--ease-standard);
}
.btn-ghost {
  margin-top: var(--space-8);
  padding: 18px calc(var(--space-6) + 6px);
  color: var(--fg);
  background: rgba(240, 240, 250, 0.1);
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
  pointer-events: auto;
}
.btn-ghost:hover {
  background: rgba(240, 240, 250, 0.2);
  color: var(--accent-hover);
  transform: translateY(-1px);
}
.btn-ghost:active {
  background: rgba(240, 240, 250, 0.06);
  color: var(--accent-active);
  transform: translateY(0);
}
.btn:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}

/* ─── Fallback notice ──────────────────────────────────────────────── */
.gl-fallback {
  display: none;
  margin-top: var(--space-5);
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
}
body.gl-failed .gl-fallback { display: block; }

/* ─── Responsive ───────────────────────────────────────────────────── */
@media (max-width: 960px) {
  .hero-title { font-size: clamp(30px, 7vw, var(--text-3xl)); }
}
@media (max-width: 600px) {
  .overlay { padding: 18px; padding-bottom: 40px; }
  .hero-title { font-size: clamp(28px, 9vw, var(--text-2xl)); max-width: 12ch; }
  .hero-sub { font-size: 14px; max-width: 34ch; }
  .btn-ghost { margin-top: var(--space-6); padding: 14px var(--space-6); }
  .hud { top: 12px; right: 12px; }
  .hud-status { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: 1ms !important; animation-duration: 1ms !important; }
}
</style>
</head>
<body>

<canvas id="gl" role="img" aria-label="Live WebGL aurora field above the curved limb of Earth"></canvas>

<div class="hud" data-od-id="hud-telemetry">
  <span class="hud-status" id="gpu-status" data-od-id="hud-status">GPU · WebGL2</span>
  <button class="hud-toggle" id="motion-toggle" type="button" aria-pressed="false" data-od-id="hud-motion-toggle">Pause</button>
</div>

<div class="overlay" data-od-id="hero-overlay">
  <p class="kicker" data-od-id="hero-kicker">Low Earth Orbit · Global Connectivity</p>
  <h1 class="hero-title" data-od-id="hero-title">Internet from orbit</h1>
  <p class="hero-sub" data-od-id="hero-sub">Low-latency broadband, relayed by a constellation in low orbit — reach at every latitude, over land and open sea.</p>
  <a class="btn btn-ghost" href="#network" data-od-id="hero-cta">Learn more</a>
  <p class="gl-fallback" data-od-id="hero-fallback">Static mode — WebGL2 unavailable on this device</p>
</div>

<script type="text/javascript">
(() => {
  const canvas = document.getElementById('gl');
  const statusEl = document.getElementById('gpu-status');
  const toggleEl = document.getElementById('motion-toggle');
  const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });

  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let paused = reduced;

  function syncToggle() {
    toggleEl.textContent = paused ? 'Resume' : 'Pause';
    toggleEl.setAttribute('aria-pressed', paused ? 'true' : 'false');
    if (gl) statusEl.textContent = paused ? 'GPU · WebGL2 · Paused' : statusEl.dataset.live || 'GPU · WebGL2';
  }

  if (!gl) {
    statusEl.textContent = 'WebGL2 unavailable';
    toggleEl.style.display = 'none';
    document.body.classList.add('gl-failed');
    return;
  }

  const vert = `#version 300 es
  in vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;

  /* Flowing aurora field over Earth's limb — spectral blue-violet on pure
     black, matching the achromatic SpaceX palette (no neon green). */
  const frag = `#version 300 es
  precision highp float;
  out vec4 o;
  uniform vec2 res;
  uniform float t;
  uniform vec2 mouse;
  uniform float mforce;

  float hash(vec2 p){
    vec3 p3 = fract(vec3(p.xyx) * 0.1031);
    p3 += dot(p3, p3.yzx + 33.33);
    return fract((p3.x + p3.y) * p3.z);
  }
  float noise(vec2 p){
    vec2 i = floor(p), f = fract(p);
    vec2 u = f*f*(3.0-2.0*f);
    return mix(mix(hash(i), hash(i+vec2(1.0,0.0)), u.x),
               mix(hash(i+vec2(0.0,1.0)), hash(i+vec2(1.0,1.0)), u.x), u.y);
  }
  float fbm4(vec2 p){
    float v = 0.0, a = 0.5;
    for(int i=0;i<4;i++){ v += a*noise(p); p = p*2.03 + vec2(11.3, 7.1); a *= 0.5; }
    return v;
  }
  float starLayer(vec2 uv, float scale, float thr, float tw){
    vec2 p = uv*scale;
    vec2 id = floor(p), f = fract(p);
    float h = hash(id);
    if(h < thr) return 0.0;
    vec2 sp = vec2(hash(id+vec2(3.1,7.7)), hash(id+vec2(9.2,1.3))) * 0.7 + 0.15;
    float d = length(f - sp);
    float b = (h - thr)/(1.0-thr);
    float twk = 0.72 + 0.28*sin(t*(1.2 + 2.6*hash(id+vec2(5.0,2.0))) + h*60.0);
    return (1.0 - smoothstep(0.0, 0.10, d)) * b * b * twk * tw;
  }

  void main(){
    vec2 uv = (gl_FragCoord.xy - 0.5*res) / res.y;
    float time = t;

    vec3 spectral = vec3(0.9412, 0.9412, 0.9804); /* #f0f0fa */
    vec3 tint     = vec3(0.50, 0.56, 1.0);         /* blue-violet spectral tint */

    /* pointer reaction — depth parallax offsets + cursor influence field */
    vec2 par = mouse * mforce * 0.02;
    vec2 uvStar = uv + par * 0.5;
    vec2 uvAur  = uv + par;
    vec2 uvEar  = uv + par * 0.85;
    float mg = exp(-length(uv - mouse) * 11.0) * mforce;

    /* deep-space base + faint haze (single noise tap) */
    vec3 col = vec3(0.0);
    float haze = noise(uv*1.3 + vec2(time*0.010, time*0.004));
    col += vec3(0.040, 0.045, 0.085) * haze * haze;

    /* starfield, two parallax layers */
    float st = starLayer(uvStar, 46.0, 0.950, 1.0) * 1.0
             + starLayer(uvStar + vec2(37.2, 11.9), 92.0, 0.976, 0.75);

    /* aurora curtains */
    float warp = fbm4(vec2(uvAur.x*1.15 + time*0.020, time*0.030));
    float curtains = fbm4(vec2(uvAur.x*2.5 + warp*1.9, uvAur.y*0.45 - time*0.016));
    float rays = noise(vec2((uvAur.x + warp*0.35)*24.0, time*0.06 + uvAur.y*1.4));
    float band = smoothstep(0.45, 0.80, curtains + rays*0.20 + mg*0.35);
    float vert = smoothstep(-0.34, -0.10, uvAur.y) * (1.0 - smoothstep(0.14, 0.52, uvAur.y));
    float striate = 0.50 + 0.50 * noise(vec2((uvAur.x + warp*0.4)*34.0, time*0.05));
    float aur = clamp(band * vert * striate, 0.0, 1.0);

    /* second, thinner band below the main curtain */
    float band2 = smoothstep(0.62, 0.95, noise(vec2(uvAur.x*3.2 - warp*1.3 + 41.0, uvAur.y*0.6 + time*0.012)));
    float vert2 = smoothstep(-0.30, -0.20, uvAur.y) * (1.0 - smoothstep(-0.08, 0.06, uvAur.y));
    float aur2 = band2 * vert2;

    /* stars sit behind the curtains */
    st *= 1.0 - 0.75*clamp(aur + aur2, 0.0, 1.0);
    col += spectral * st * 0.9;

    col += mix(tint, spectral, clamp(aur*0.70, 0.0, 1.0)) * aur;
    col += mix(tint, spectral, 0.40) * aur2 * 0.4;

    /* spectral cursor halo — swells while the pointer sweeps */
    col += mix(tint, spectral, 0.55) * mg * 0.10;
    col += mix(tint, spectral, 0.50) * aur * mg * 0.35;

    /* Earth limb — black silhouette with spectral atmosphere rim */
    float ed = length(uvEar - vec2(0.0, -2.2)) - 1.85; /* <0 inside Earth */
    float inside = 1.0 - smoothstep(-0.004, 0.004, ed);
    col = mix(col, vec3(0.0), inside);
    float outside = 1.0 - inside;
    col += tint * exp(-max(ed, 0.0) * 11.0) * 0.70 * outside;
    col += spectral * exp(-max(ed, 0.0) * 34.0) * 0.50 * outside;

    /* vignette + soft tonemap */
    vec2 vuv = uv * vec2(0.72, 1.05);
    col *= max(1.0 - 0.38*dot(vuv, vuv), 0.0);
    col = col / (1.0 + col * 0.55);
    col = pow(col, vec3(0.90));
    o = vec4(col, 1.0);
  }`;

  function compile(type, src){
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(s) || 'shader compile error';
      console.error(log);
      throw new Error(log);
    }
    return s;
  }

  let prog, uRes, uT, uMouse, uForce;
  try {
    prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, vert));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, frag));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(prog) || 'link error');
    }
    gl.useProgram(prog);
    uRes = gl.getUniformLocation(prog, 'res');
    uT = gl.getUniformLocation(prog, 't');
    uMouse = gl.getUniformLocation(prog, 'mouse');
    uForce = gl.getUniformLocation(prog, 'mforce');
  } catch (err) {
    statusEl.textContent = 'Shader error';
    toggleEl.style.display = 'none';
    document.body.classList.add('gl-failed');
    return;
  }

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  /* Adaptive render scale: start below cap, step down when the measured
     frame rate misses 59fps, probe back up only after a sustained run. */
  const DPR_CAP = 2;
  let quality = (window.devicePixelRatio || 1) > 1 ? 0.75 : 1.0;
  let lastQualityChange = 3000;
  let lowWindows = 0, goodWindows = 0;

  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, DPR_CAP) * quality;
    const w = Math.max(1, Math.floor(canvas.clientWidth * dpr));
    const h = Math.max(1, Math.floor(canvas.clientHeight * dpr));
    if (w === canvas.width && h === canvas.height) return false;
    canvas.width = w;
    canvas.height = h;
    gl.viewport(0, 0, w, h);
    return true;
  }

  function adaptQuality(fps, now){
    if (now - lastQualityChange < 2500) return;
    if (fps < 59) {
      lowWindows++;
      goodWindows = 0;
      if (lowWindows >= 2 && quality > 0.5) {
        quality = Math.max(0.5, quality * 0.8);
        lastQualityChange = now;
        lowWindows = 0;
      }
    } else if (fps >= 59.5) {
      goodWindows++;
      lowWindows = 0;
      if (goodWindows >= 8 && quality < 1) {
        quality = Math.min(1, quality * 1.12);
        lastQualityChange = now;
        goodWindows = 0;
      }
    } else {
      lowWindows = 0;
      goodWindows = 0;
    }
  }

  /* Pointer reaction state: smoothed position, presence, sweep energy. */
  let ptX = 0, ptY = 0, ptTX = 0, ptTY = 0;
  let ptInside = false, ptPresence = 0, ptEnergy = 0, ptPrev = null;

  function pointerUV(e){
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return null;
    return [ (e.clientX - 0.5 * w) / h, (0.5 * h - e.clientY) / h ];
  }

  function pointerSet(e){
    const p = pointerUV(e);
    if (!p) return;
    if (ptPrev) {
      const d = Math.hypot(p[0] - ptPrev[0], p[1] - ptPrev[1]);
      ptEnergy = Math.min(1, ptEnergy + d * 3.0);
    }
    ptPrev = p;
    ptTX = p[0]; ptTY = p[1];
    ptInside = true;
  }

  window.addEventListener('pointermove', pointerSet, { passive: true });
  window.addEventListener('pointerdown', (e) => {
    ptEnergy = Math.min(1, ptEnergy + 0.4);
    pointerSet(e);
  }, { passive: true });
  document.documentElement.addEventListener('pointerleave', () => {
    ptInside = false; ptPrev = null;
  });
  window.addEventListener('blur', () => { ptInside = false; ptPrev = null; });

  function updatePointer(dt){
    if (reduced) {
      ptX = ptTX; ptY = ptTY; ptEnergy = 0;
    } else {
      const k = 1 - Math.exp(-dt * 10);
      ptX += (ptTX - ptX) * k;
      ptY += (ptTY - ptY) * k;
      ptEnergy *= Math.exp(-dt * 2.2);
    }
    ptPresence += ((ptInside ? 1 : 0) - ptPresence) * (1 - Math.exp(-dt * 6));
  }

  function pointerForce(){ return ptPresence * (0.30 + 0.70 * ptEnergy); }

  let simTime = 0;
  let needsDraw = true;
  let frames = 0, fpsAcc = 0, fpsLast = 0;

  let errChecks = 0;
  function draw(){
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uT, simTime);
    gl.uniform2f(uMouse, ptX, ptY);
    gl.uniform1f(uForce, pointerForce());
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (errChecks < 5) {
      errChecks++;
      const err = gl.getError();
      if (err !== gl.NO_ERROR) console.error('WebGL error:', err);
    }
  }

  function frame(now){
    const resized = resize();
    if (!paused) {
      const delta = fpsLast ? now - fpsLast : 0;
      fpsLast = now;
      const dt = Math.min(delta, 100) / 1000;
      simTime += dt;
      updatePointer(dt);
      draw();
      frames++;
      fpsAcc += delta;
      if (fpsAcc >= 1000) {
        const fps = frames * 1000 / fpsAcc;
        const label = 'GPU · WebGL2 · ' + Math.round(fps) + 'fps';
        statusEl.dataset.live = label;
        statusEl.textContent = label;
        adaptQuality(fps, now);
        frames = 0; fpsAcc = 0;
      }
    } else if (resized || needsDraw) {
      draw();
      needsDraw = false;
    }
    requestAnimationFrame(frame);
  }

  toggleEl.addEventListener('click', () => {
    paused = !paused;
    needsDraw = true;
    fpsLast = 0; frames = 0; fpsAcc = 0;
    lowWindows = 0; goodWindows = 0;
    syncToggle();
  });

  window.addEventListener('resize', () => { needsDraw = true; });

  syncToggle();
  if (paused) statusEl.textContent = 'GPU · WebGL2 · Paused';
  requestAnimationFrame(frame);
})();
</script>
